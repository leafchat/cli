name: API drift

# 本番の leafchat の OpenAPI と、生成済みの型（src/infrastructure/generated/leafchat-api.d.ts）のずれを毎日見る。
# ずれたら workflow が失敗し、その通知で気付く（Issue は作らない）。直すときは pnpm gen:api の後に pnpm check-types を通す。

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  api-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Compare the generated types with the production OpenAPI
        run: pnpm check:api
